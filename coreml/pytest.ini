[pytest]
testpaths = tests
markers =
    fast: quick checks on FAST (200 dev-clean utterances), under 10 minutes
    full: dev-clean + dev-other WER and the speed benchmark
    release: test-clean + test-other, run once for a release
addopts = -ra -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
